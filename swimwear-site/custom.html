<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>תפירה בהתאמה אישית — calma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="sub-header">
    <a class="back-link" href="index.html" aria-label="חזרה לעמוד הבית">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </a>
    <a class="sub-logo" href="index.html">calma</a>
    <span class="back-link" aria-hidden="true"></span>
  </header>

  <main class="sub-main">
    <div class="custom-page">
      <h1>תפירה בהתאמה אישית</h1>
      <p>רוצה בגד ים שנתפר בדיוק למידות שלך? השאירי פרטים ונחזור אליך.</p>
      <form class="custom-form" id="customForm">
        <input type="text" id="customName" placeholder="שם מלא" required />
        <input type="tel" id="customPhone" placeholder="טלפון" required />
        <textarea id="customMsg" placeholder="מה תרצי לתפור? (מידות, דגם, בד...)"></textarea>
        <button type="submit" class="btn btn-block">שליחה</button>
      </form>
      <p class="custom-note" id="customNote"></p>
    </div>
  </main>

  <footer class="footer">
    <p class="footer-logo">calma</p>
    <p>© 2026 calma — בגדי ים. כל הזכויות שמורות.</p>
  </footer>

  <script>
    document.getElementById('customForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const n = document.getElementById('customNote');
      n.textContent = 'תודה! קיבלנו את הפרטים ונחזור אליך בהקדם 💌';
      n.classList.add('ok');
      this.reset();
    });
  </script>
</body>
</html>
